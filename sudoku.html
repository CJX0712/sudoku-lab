<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sudoku Lab · 数独实验室 — 唯一解保证</title>
<style>
:root{--bg:#f6f7fb;--ink:#1a1d29;--muted:#6b7280;--line:#d8dbe6;--acc:#2563eb;--ok:#16a34a;--bad:#dc2626;--hl:#eef2ff;--card:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px}
h1{font-size:22px;letter-spacing:.5px}
h1 small{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 14px}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:8px;font-size:14px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{opacity:.9;color:#fff}
.board{display:grid;grid-template-columns:repeat(9,44px);grid-template-rows:repeat(9,44px);border:2.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card);box-shadow:0 10px 30px rgba(26,29,41,.08)}
.cell{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;border:1px solid var(--line);cursor:pointer;user-select:none;position:relative}
.cell.b{border-right:2px solid var(--ink)}.cell.bb{border-bottom:2px solid var(--ink)}
.cell.given{background:var(--hl)}
.cell.sel{outline:2px solid var(--acc);outline-offset:-2px;z-index:1}
.cell.err{color:var(--bad)}
.cell.same{background:#dbeafe}
.cell.done{color:var(--ok)}
input{width:100%;height:100%;border:0;outline:0;text-align:center;font:inherit;font-weight:600;background:transparent;color:inherit}
#stat{margin-top:14px;font-size:13.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
#stat b{color:var(--ink)}
#log{margin-top:10px;font-size:13px;min-height:20px}
#log.ok{color:var(--ok)}#log.bad{color:var(--bad)}
footer{margin-top:26px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.8}
footer code{background:var(--hl);padding:2px 6px;border-radius:4px}
@media(max-width:480px){.board{grid-template-columns:repeat(9,minmax(30px,1fr));grid-template-rows:repeat(9,minmax(30px,1fr));width:100%}.cell{font-size:16px}}
</style>
</head>
<body>
<h1>Sudoku Lab<small>零依赖 · 单文件 · 唯一解保证</small></h1>
<div class="bar">
  <button class="pri" onclick="newGame('easy')">入门</button>
  <button class="pri" onclick="newGame('mid')">进阶</button>
  <button class="pri" onclick="newGame('hard')">困难</button>
  <button onclick="solve()">求解</button>
  <button onclick="check()">校验</button>
  <button onclick="hint()">提示一格</button>
</div>
<div class="board" id="board"></div>
<div id="stat">空格 <b id="blanks">0</b> · 耗时 <b id="time">00:00</b> · 求解器回溯 <b id="steps">0</b> 步</div>
<div id="log"></div>
<footer>
  不变量：每个谜题在挖洞前用「解计数器」验证全局唯一解（count==1）· 行/列/宫 1–9 各恰好一次<br>
  自检：浏览器控制台运行 <code>selfTest(50)</code> → 50 张谜题全部唯一解且终盘有效即全绿 · 作者 晨星
</footer>
<script>
"use strict";
// ---------- 核心引擎（纯函数，可被 Node 无头自检复用） ----------
const idx=(r,c)=>r*9+c, RC=i=>[i/9|0,i%9], B3=i=>(i/27|0)*3+(i%9/3|0);
function rowOf(i){return i/9|0} function colOf(i){return i%9}
function boxOf(i){return B3(i)}
const ROWS=[...Array(9)].map((_,r)=>[...Array(9)].map((_,c)=>idx(r,c)));
const COLS=[...Array(9)].map((_,c)=>[...Array(9)].map((_,r)=>idx(r,c)));
const BOX=[...Array(9)].map((_,b)=>{const a=[];for(let r=(b/3|0)*3;r<(b/3|0)*3+3;r++)for(let c=(b%3)*3;c<(b%3)*3+3;c++)a.push(idx(r,c));return a});
function validGrid(g){ // 每行/列/宫 1-9 恰好一次
  for(const grp of [...ROWS,...COLS,...BOX]){
    const s=new Set(grp.map(i=>g[i]));
    if(s.size!==9||[...s].some(v=>v<1||v>9))return false;
  } return true;
}
function solveCount(g,limit){ // 回溯解计数（上限剪枝，用于唯一性验证）
  let steps=0,count=0;
  (function bt(){
    if(count>=limit)return;
    let best=-1,bestC=null;
    for(let i=0;i<81;i++)if(!g[i]){
      const cand=[];
      for(let v=1;v<=9;v++)if(ok(i,v,g))cand.push(v);
      if(!cand.length)return;
      if(best<0||cand.length<bestC.length){best=i;bestC=cand;if(cand.length===1)break}
    }
    if(best<0){count++;return}
    for(const v of bestC){
      g[best]=v;steps++;bt();g[best]=0;
      if(count>=limit)return;
    }
  })();
  return {count,steps};
}
function ok(i,v,g){
  for(const j of ROWS[rowOf(i)])if(g[j]===v)return false;
  for(const j of COLS[colOf(i)])if(g[j]===v)return false;
  for(const j of BOX[boxOf(i)])if(g[j]===v)return false;
  return true;
}
function fill(g){ // 随机回溯生成完整终盘
  for(let i=0;i<81;i++)if(!g[i]){
    const vs=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-.5);
    for(const v of vs)if(ok(i,v,g)){g[i]=v;if(fill(g))return true;g[i]=0}
    return false;
  }
  return true;
}
function generate(holes){ // 挖洞：每挖一格都用解计数器保证唯一解
  const sol=new Array(81).fill(0);
  fill(sol);
  const puzzle=sol.slice();
  const cells=[...Array(81).keys()].sort(()=>Math.random()-.5);
  let dug=0;
  for(const i of cells){
    if(dug>=holes)break;
    const bak=puzzle[i];puzzle[i]=0;
    if(solveCount(puzzle.slice(),2).count!==1)puzzle[i]=bak;else dug++;
  }
  return {sol,puzzle,dug};
}
// ---------- UI ----------
let G,EMPTY,GIVEN,startT,timer,steps;
const boardEl=document.getElementById('board');
function build(){boardEl.innerHTML='';for(let i=0;i<81;i++){const d=document.createElement('div');d.className='cell'+(i%9===8?' b':'')+((i/9|0)%3===2?' bb':'');d.dataset.i=i;boardEl.appendChild(d)}}
function render(){
  for(const d of boardEl.children){
    const i=+d.dataset.i,v=G[i];
    if(!EMPTY.has(i)&&!GIVEN.has(i)){ // 用户填的
      d.innerHTML='<input maxlength="1" inputmode="numeric" value="'+(v||'')+'">';
      const inp=d.firstChild;
      inp.oninput=()=>{const n=inp.value.replace(/[^1-9]/g,'');inp.value=n;G[i]=+n||0;refresh();};
      inp.onfocus=()=>sel(i);
    } else d.textContent=v||'';
  }
  document.getElementById('blanks').textContent=[...G].filter(x=>!x).length;
  refresh();
}
function sel(i){for(const d of boardEl.children)d.classList.toggle('sel',+d.dataset.i===i)}
function refresh(){
  const selI=+((boardEl.querySelector('.sel')||{}).dataset?.i??-1);
  const sv=selI>=0?G[selI]:0;
  for(const d of boardEl.children){
    const i=+d.dataset.i,v=G[i];
    d.classList.toggle('same',!!sv&&v===sv&&i!==selI);
    d.classList.toggle('given',GIVEN.has(i));
    d.classList.toggle('err',!!v&&!GIVEN.has(i)&&!ok(i,v,G));
    if(!EMPTY.has(i)&&!GIVEN.has(i)&&v)d.classList.add('done');
  }
}
function newGame(level){
  const holes=level==='easy'?38:level==='mid'?48:54;
  const {puzzle,dug}=generate(holes);
  G=puzzle.slice();GIVEN=new Set(puzzle.map((v,i)=>v?i:-1).filter(i=>i>=0));EMPTY=new Set();
  steps=0;startT=Date.now();clearInterval(timer);
  timer=setInterval(()=>{const s=(Date.now()-startT)/1000|0;document.getElementById('time').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
  log(`新局：挖掉 ${dug} 格，唯一解已验证 ✅`,'ok');build();render();
}
function solve(){
  const r=solveCount(G.slice(),2);
  steps+=r.steps;
  document.getElementById('steps').textContent=steps;
  if(r.count===0)return log('此局无解 ✗','bad');
  // 用一个完整求解填入
  const g=G.slice();
  (function bt(){let best=-1,bc=null;
    for(let i=0;i<81;i++)if(!g[i]){const c=[];for(let v=1;v<=9;v++)if(ok(i,v,g))c.push(v);if(!c.length)return;if(best<0||c.length<bc.length){best=i;bc=c;if(c.length===1)break}}
    if(best<0)return true;
    for(const v of bc){g[best]=v;if(bt())return true;g[best]=0}return false})();
  if(!validGrid(g))return log('求解失败 ✗','bad');
  G=g;EMPTY=new Set();render();log('已求解，终盘通过 27 组 1–9 恰好一次校验 ✅','ok');
}
function check(){
  const full=[...G].every(x=>x);
  if(full&&validGrid(G)){clearInterval(timer);log('完成！终盘有效，用时 '+document.getElementById('time').textContent+' ✅','ok')}
  else{const bad=[...boardEl.children].filter(d=>d.classList.contains('err')).length;log(full?'存在冲突，未通过校验 ✗':'还有空格：'+[...G].filter(x=>!x).length+' 个','bad')}
}
function hint(){
  const {sol}=generate.cache||{};
  const empt=[...Array(81).keys()].filter(i=>!G[i]);
  if(!empt.length)return log('已填满','ok');
  // 现场重新求唯一解取提示
  const g=G.slice();(function bt(){let best=-1,bc=null;
    for(let i=0;i<81;i++)if(!g[i]){const c=[];for(let v=1;v<=9;v++)if(ok(i,v,g))c.push(v);if(!c.length)return;if(best<0||c.length<bc.length){best=i;bc=c;if(c.length===1)break}}
    if(best<0)return true;
    for(const v of bc){g[best]=v;if(bt())return true;g[best]=0}return false})();
  const i=empt[Math.random()*empt.length|0];G[i]=g[i];GIVEN.add(i);EMPTY.delete(i);
  render();log('提示：r'+(i/9+1)+'c'+(i%9+1)+' = '+g[i]);
}
function log(msg,cls){const el=document.getElementById('log');el.textContent=msg;el.className=cls||''}
// ---------- 自检（Node 无头亦可运行：去掉 UI 部分调用 selfTest） ----------
function selfTest(n=50){
  let pass=0;
  for(let k=0;k<n;k++){
    const {sol,puzzle}=generate(50);
    if(!validGrid(sol))return {pass,fail:'终盘无效'};
    if(solveCount(puzzle.slice(),2).count!==1)return {pass,fail:'解不唯一'};
    pass++;
  }
  return {pass,fail:null};
}
if(typeof window!=='undefined'){window.newGame=newGame;window.solve=solve;window.check=check;window.hint=hint;window.selfTest=selfTest;newGame('mid')}
else if(typeof module!=='undefined')module.exports={generate,validGrid,solveCount,ok,selfTest};
</script>
</body>
</html>
